AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::LanguageExtensions

Description: AWS CloudFormation workshop - Language extensions (uksb-1q9p31idr) (tag:language-extensions).

Parameters:
  LatestAmiId:
    Description: The ID of the region-specific Amazon Machine Image to use.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
  DeletionPolicyParameter:
    Type: String
    AllowedValues: [Delete, Retain]
    Default: Delete

Resources:
  EC2Instance:
    Type: AWS::EC2::Instance
    DeletionPolicy: !Ref DeletionPolicyParameter
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      Tags:
        - Key: Environment
          Value: DEV

  S3Bucket:
    DeletionPolicy: !Ref DeletionPolicyParameter
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardBody:
        Fn::ToJsonString:
          start: -PT6H
          periodOverride: inherit
          widgets:
            - type: metric
              x: 0
              "y": 7
              width: 3
              height: 3
              properties:
                metrics:
                  [[AWS/EC2, CPUUtilization, InstanceId, !Ref EC2Instance]]
                period: 300
                stat: Average
                region: !Ref AWS::Region
                title: EC2 Instance CPU

  s3Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardBody:
        Fn::ToJsonString:
          start: -PT6H
          periodOverride: inherit
          widgets:
            - type: metric
              x: 0
              "y": 7
              width: 10
              height: 10
              properties:
                metrics:
                  [
                    [
                      AWS/S3,
                      NumberOfObjects,
                      StorageType,
                      AllStorageTypes,
                      BucketName,
                      !Ref S3Bucket,
                    ],
                  ]
                period: 300
                stat: Average
                region: !Ref AWS::Region
                title: Number of objects in S3 bucket

Outputs:
  InstanceId:
    Description: The ID of the newly-created EC2 instance.
    Value: !Ref EC2Instance
