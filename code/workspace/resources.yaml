# Add Format Version section here.
AWSTemplateFormatVersion: "2010-09-09"

# Add Description section here.
Description: AWS CloudFormation workshop - Resources (uksb-19034202) (tag:resources).

# Add Metadata section here.
Metadata:
  AWS:CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Amazon EC2 Configuration"
        Parameters:
          - InstanceType
    ParameterLabels:
      InstanceType:
        default: "Type of EC2 Instance"

# Add Parameters section here.
Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.small
    Description: "Enter t2.micro or t2.small. Default is t2.micro"
  LatestAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2"

# Add Resources section here.
Resources:
  WebServerInstance:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
